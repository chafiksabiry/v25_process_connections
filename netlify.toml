[build]
  publish = "dist"
  command = "npm ci && npm run build"

[build.environment]
  # Default / branch / preview: load *-dev microfrontends
  VITE_MF_AUTH_ENTRY = "https://harx26register-dev.netlify.app"
  VITE_MF_COMPANY_ENTRY = "https://harx26comporchestratorfront-dev.netlify.app"
  VITE_MF_REPS_ENTRY = "https://harx26reporchestratorfront-dev.netlify.app"
  VITE_MF_HOME_ENTRY = "https://websitev2026.netlify.app"
  VITE_MF_CALLCENTER_ENTRY = "https://harx26callcenter-recette.netlify.app"
  # API de l'orchestrateur (code de liaison WhatsApp). Numéro du support : VITE_WHATSAPP_SUPPORT_NUMBER (défaut 212637446431).
  VITE_API_URL_ORCHESTRATOR = "https://v25comporchestratorback-recette.up.railway.app/api"

# Production (harx.ai) — production Netlify MF hosts (not *-dev)
[context.production.environment]
  VITE_META_PIXEL_ID = "340901355517689"
  VITE_API_URL_ORCHESTRATOR = "https://v25comporchestratorback-production.up.railway.app/api"
  VITE_MF_AUTH_ENTRY = "https://harx25register.netlify.app"
  VITE_MF_COMPANY_ENTRY = "https://harxv25comporchestratorfront.netlify.app"
  VITE_MF_REPS_ENTRY = "https://harxv25reporchestratorfront.netlify.app"
  VITE_MF_HOME_ENTRY = "https://websitev2026.netlify.app"
  VITE_MF_CALLCENTER_ENTRY = "https://harxv25callcenterfront.netlify.app"

# Alias used by some Netlify branch setups
[context.prod.environment]
  VITE_META_PIXEL_ID = "340901355517689"
  VITE_API_URL_ORCHESTRATOR = "https://v25comporchestratorback-production.up.railway.app/api"
  VITE_MF_AUTH_ENTRY = "https://harx25register.netlify.app"
  VITE_MF_COMPANY_ENTRY = "https://harxv25comporchestratorfront.netlify.app"
  VITE_MF_REPS_ENTRY = "https://harxv25reporchestratorfront.netlify.app"
  VITE_MF_HOME_ENTRY = "https://websitev2026.netlify.app"
  VITE_MF_CALLCENTER_ENTRY = "https://harxv25callcenterfront.netlify.app"

# Ancienne adresse du produit : redirection permanente vers /telephony (liens, favoris, moteurs de recherche).
[[redirects]]
  from = "/callcentre"
  to = "/telephony"
  status = 301
  force = true

[[redirects]]
  from = "/callcentre/*"
  to = "/telephony/:splat"
  status = 301
  force = true

# Page vitrine pré-rendue (SEO) générée au build par vite.config.ts ; le conteneur qiankun y est conservé.
[[redirects]]
  from = "/telephony"
  to = "/telephony/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
