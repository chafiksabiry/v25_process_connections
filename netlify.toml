[build]
  publish = "dist"
  command = "npm ci && npm run build"

[build.environment]
  # Default / branch / preview: load *-dev microfrontends
  VITE_MF_AUTH_ENTRY = "https://harx26register-dev.netlify.app"
  VITE_MF_COMPANY_ENTRY = "https://harx26comporchestratorfront-dev.netlify.app"
  VITE_MF_REPS_ENTRY = "https://harx26reporchestratorfront-dev.netlify.app"
  VITE_MF_HOME_ENTRY = "https://websitev2026.netlify.app"

# Production (harx.ai) — production Netlify MF hosts (not *-dev)
[context.production.environment]
  VITE_MF_AUTH_ENTRY = "https://harx25register.netlify.app"
  VITE_MF_COMPANY_ENTRY = "https://harxv25comporchestratorfront.netlify.app"
  VITE_MF_REPS_ENTRY = "https://harxv25reporchestratorfront.netlify.app"
  VITE_MF_HOME_ENTRY = "https://websitev2026.netlify.app"

# Alias used by some Netlify branch setups
[context.prod.environment]
  VITE_MF_AUTH_ENTRY = "https://harx25register.netlify.app"
  VITE_MF_COMPANY_ENTRY = "https://harxv25comporchestratorfront.netlify.app"
  VITE_MF_REPS_ENTRY = "https://harxv25reporchestratorfront.netlify.app"
  VITE_MF_HOME_ENTRY = "https://websitev2026.netlify.app"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
